[*]
top-p = 0.95
min-p = 0.0
parallel = 2

; TODO: investigate what the ideal value is, based on real usage?
slot-prompt-similarity = 0.5
cache-reuse = 256
ngl = 999
kv-unified = 1
cache-type-k = q8_0
cache-type-v = q8_0
no-mmproj = 1
flash-attn = on
fit = off
sm = tensor
ts = 1,1
c = 200000
spec-type = draft-mtp,ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 16
spec-ngram-mod-n-max = 32
spec-draft-n-max = 4
spec-draft-p-min = 0.8
reasoning-preserve = 1
main-gpu = 0
threads = 12
threads-batch = 24

; TODO: try batch-size/ubatch-size tuning on qwen3.6-26b and gemma4-31b too;
; also worth testing whether gemma4-31b/qwen3.6-26b (currently on automatic
; sm=tensor splitting) would benefit from switching to this manual
; override-tensor + 100,0 tensor-split partitioning scheme instead
[gemma4-31b]
hf = unsloth/gemma-4-31b-it-GGUF:UD-Q6_K_XL
temp = 1.0
top-k = 64
fit-target = 2560
alias = gemma4-31b

[qwen3.6-26b]
hf = unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q6_K_XL
temp = 0.6
top-k = 20
alias = qwen3.6-26b

[qwen3.5-4b]
hf = unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL
alias = qwen3.5-4b
temp = 0.7
top-p = 0.8
top-k = 20
parallel = 1
; TODO: given max models set to 1, no reason not to move this to GPU
; that being said, might be worthwhile to preserve (commented) CPU config
ngl = 0
device = CUDA1
sm = none
batch-size = 4096
ubatch-size = 2048
c = 32768
spec-type = none
reasoning = off
chat-template-file = /home/easha/.config/llama.cpp/qwen3.5-4b-fixed.jinja

[deepseek4-flash]
hf = unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ4_NL
; TODO: analyze if we can squeeze some more layers onto the GPU's especially CUDA 1
override-tensor = blk\.[0-2]\.ffn_.*_exps\.weight=CUDA0,blk\.3\.ffn_(gate|up)_exps\.weight=CUDA0,blk\.(3[6-9]|4[0-2])\.ffn_.*_exps\.weight=CUDA1,blk\.35\.ffn_(gate|up)_exps\.weight=CUDA1,\.ffn_(up|down|gate|gate_up)_(ch|)exps=CPU
load-mode = none
sm = layer
ngl = auto
tensor-split = 100,0
; TODO: experiment with higher batch-size for this and other models
batch-size = 4096
ubatch-size = 4096
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 96
temp = 1.0
alias = deepseek4-flash
; TODO: try with higher quant cache
