# Core
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
notify = ["bash", "-lc", "printf '\\007' > /dev/tty"]
personality = "pragmatic"
plan_mode_reasoning_effort = "high"

[model_providers.llama_cpp]
name = "llama.cpp"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"

# Behavior
[features]
hooks = true
memories = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
log_user_prompt = false
metrics_exporter = "none"
trace_exporter = "none"

[notice]
fast_default_opt_out = true

# Terminal UI/UX
[tui]
auto_recap = false
notification_method = "bel"
notifications = ["approval-requested"]
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "approval-mode"]
status_line_use_colors = true

[tui.keymap.chat]
next_permission_mode = "alt-p"

# MCP servers
[mcp_servers.github]
args = ["stdio"]
command = "github-mcp-server"
default_tools_approval_mode = "writes"
disabled_tools = [
    "add_issue_comment",
    "assign_copilot_to_issue",
    "create_branch",
    "create_or_update_file",
    "create_pull_request",
    "create_repository",
    "delete_file",
    "fork_repository",
    "issue_write",
    "merge_pull_request",
    "push_files",
    "request_copilot_review",
    "sub_issue_write",
    "update_pull_request",
    "update_pull_request_branch",
]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
